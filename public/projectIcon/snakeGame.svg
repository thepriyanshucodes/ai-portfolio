<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Rounded Canvas Background -->
  <rect width="64" height="64" rx="14" fill="#0f0f14"/>

  <!-- Subtle Inner Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#2a2a35" stroke-width="2"/>

  <!-- Red Apple -->
  <circle cx="50" cy="14" r="5" fill="#e74c3c"/>
  <!-- Apple Leaf -->
  <path d="M50 9 Q53 7 52 5 Q49 7 50 9 Z" fill="#4CAF50"/>

  <!-- Snake Body ("S" Curve) -->
  <g fill="#4CAF50" stroke="#0f0f14" stroke-width="1.5" stroke-linejoin="round">
    <!-- Tail -->
    <rect x="14" y="50" width="10" height="10" rx="2"/>
    <rect x="22" y="50" width="10" height="10" rx="2"/>
    <rect x="30" y="50" width="10" height="10" rx="2"/>
    <rect x="38" y="50" width="10" height="10" rx="2"/>
    
    <!-- Middle Curve -->
    <rect x="38" y="41" width="10" height="10" rx="2"/>
    <rect x="38" y="32" width="10" height="10" rx="2"/>
    <rect x="30" y="32" width="10" height="10" rx="2"/>
    <rect x="22" y="32" width="10" height="10" rx="2"/>
    <rect x="14" y="32" width="10" height="10" rx="2"/>
    <rect x="14" y="23" width="10" height="10" rx="2"/>
    <rect x="14" y="14" width="10" height="10" rx="2"/>
    <rect x="22" y="14" width="10" height="10" rx="2"/>
    <rect x="30" y="14" width="10" height="10" rx="2"/>
  </g>

  <!-- Snake Head -->
  <g transform="translate(38, 14)">
    <rect x="0" y="0" width="10" height="10" rx="3" fill="#4CAF50" stroke="#0f0f14" stroke-width="1.5"/>
    <!-- Eye -->
    <circle cx="7" cy="3" r="1.5" fill="white"/>
    <circle cx="7.5" cy="3" r="0.75" fill="black"/>
    <!-- Tongue -->
    <path d="M10 5 L14 5 L16 3 M14 5 L16 7" stroke="#e74c3c" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
</svg>
