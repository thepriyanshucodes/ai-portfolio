<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Canvas Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#0f0f17" />
    </linearGradient>

    <!-- Vibrant Pencil Gradient -->
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Glowing Accent Gradient for Draft Lines -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Subtle Grid Lines (Whiteboard feel) -->
  <path d="M128 0V512 M256 0V512 M384 0V512 M0 128H512 M0 256H512 M0 384H512" 
        stroke="#ffffff" stroke-opacity="0.04" stroke-width="2" />

  <!-- Whiteboard Shapes (Square, Circle, Line) -->
  <g opacity="0.85">
    <!-- Circle Shape -->
    <circle cx="160" cy="170" r="45" 
            fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-dasharray="1 3" />

    <!-- Square Shape -->
    <rect x="290" y="270" width="90" height="90" rx="12" 
          fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" />

    <!-- Arrow/Line -->
    <path d="M 140 370 L 220 290" 
          stroke="#a855f7" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Central Stylized Pencil / Stylus -->
  <g filter="url(#glow)">
    <!-- Main Pencil Body -->
    <path d="M 370 120 L 400 150 L 220 330 L 170 340 L 180 290 Z" 
          fill="url(#pencilGrad)" stroke="#60a5fa" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Pencil Tip -->
    <path d="M 170 340 L 202 333 L 187 318 Z" 
          fill="#f8fafc" />
          
    <!-- Active Drawing Tip Glow -->
    <circle cx="168" cy="342" r="6" fill="#38bdf8" />
  </g>

  <!-- Live Freehand Stroke (Connecting Pencil Tip) -->
  <path d="M 168 342 C 110 400, 220 440, 290 420 S 410 380, 440 430" 
        fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
</svg>
